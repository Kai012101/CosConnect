    <!-- SEO: Structured Data — FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is CosConnect+?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CosConnect+ is a student-run club at Monash University dedicated to cosmetic science. We run formulation workshops, industry networking events, and career sessions for students passionate about beauty science, skincare, and personal care."
          }
        },
        {
          "@type": "Question",
          "name": "Who can join CosConnect+?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Any Monash University student with an interest in cosmetic science, chemistry, beauty, skincare, or related fields is welcome to join. You do not need to be studying pharmacy or chemistry — curiosity is enough."
          }
        },
        {
          "@type": "Question",
          "name": "What events does CosConnect+ run?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We run formulation workshops, industry guest speaker sessions, career networking events including Monash Pharmaceutical Science Employability Week, orientation mixers, and hands-on chemistry of beauty sessions throughout the semester."
          }
        },
        {
          "@type": "Question",
          "name": "How do I become a member of CosConnect+?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can become a member by filling in the membership form linked on our homepage. Membership connects you to our community, events calendar, and networking opportunities with cosmetic science professionals."
          }
        }
      ]
    }
